[[image.main.known_gap]]
range = [0x00119B5C, 0x00119B60]
why = """A lone `jr ra` after sceSifWriteBackDCache whose delay slot is the next
function's `addiu sp, sp, -64`: unreachable, and wrong if it ever ran."""

# ---------------------------------------------------------------------------
# Overlays. Every one keeps its static constructors in .data, between the
# data and the ctor table the loader walks after each load. RGDecomp clamps
# its maps to the header's .text, so none of them is mapped there. Bounds:
# from each table entry to its `jr ra` + delay slot, zero padding after.
# ---------------------------------------------------------------------------
[image.title]
symbols = "title.symbols.txt"
overlay = "BIN/TITLE.BIN"

static_init = [
  [0x004F1700, 0x004F1754], [0x004F1760, 0x004F17D8], [0x004F17E0, 0x004F182C],
  [0x004F1830, 0x004F18A0],
]

