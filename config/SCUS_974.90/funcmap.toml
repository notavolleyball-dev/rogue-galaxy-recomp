# ---------------------------------------------------------------------------
# Main ELF. Its single RWX PROGBITS (0x00100000..0x00481080) holds, in order:
#   0x00100000..0x00436958  EE code
#   0x00436980..0x00446470  VU microcode (VIF MPG packets) and rodata
#   0x00446470..0x00447768  kernel-mode payloads (see the removal below)
#   0x00447768..0x00469180  rodata and data (CD library state lives at 0x4479xx)
#   0x00469180..0x0046F9BC  static constructors (StaticInit*)
#   0x0046F9C0..0x00481080  .data, starting with the constructor table
# ---------------------------------------------------------------------------
[image.main]
symbols = "main.symbols.txt"
code = [[0x00100000, 0x00436958], [0x00469180, 0x0046F9BC]]
# The static constructor table the CRT walks (a0..a1 at the call at 0x100e24).
# Every entry must be a function start.
ctor_table = [0x0046F9C0, 0x0046FD64]
# Where a mapped function is really several, each its own function from here.
# rg_entry_002d94b0 is eight 8-byte getters (jr ra + a load, then padding)
# that a vtable at 0x471680 points at one by one; the game called 0x2D94D0.
split = [0x002D94C0, 0x002D94D0, 0x002D94E0, 0x002D94F0, 0x002D9500, 0x002D9510, 0x002D9520]

[[image.main.remove]]
range = [0x00436D00, 0x00436D18]
why = """VuMicrocodeData_436d00/_436d10: VU instruction pairs inside a VIF MPG
packet (DMA tag at 0x436980, MPG at 0x43698C), not EE code. Decoded as EE they
are jumps to 0x41C015C/0x4112004."""

[[image.main.remove]]
range = [0x00446470, 0x00447768]
why = """Kernel-mode payloads of the SDK's kernel patches (TLB, ExecPS2, alarms,
iSetAlarm). InitTLBFunctions_11ff30, InitTLB32MB_1200f8, InitExecPS2_120a40
and InitAlarm_120df8 copy them into kernel RAM; they are linked for kernel
addresses (their JALs go to 0x0007xxxx) and never run where they sit. The
runtime provides those services as syscalls."""

[[image.main.resize]]
start = 0x00207A80
end = 0x00207A88
why = """TaskLoadSound_207a80 is two functions: a thunk `j 0x207a90` with a0 = 0,
then the real function. TITLE.BIN calls 0x207a90 directly (jal at 0x4f1254),
so it needs its own entry in the main image."""

[[image.main.add]]
name = "TaskLoadSoundArg"
range = [0x00207A90, 0x00207AC0]
why = "Second half of TaskLoadSound_207a80, see the resize above."

# Static constructors the CRT calls from the table at 0x46F9C0 that the map
# missed or merged. Found by the first boot: the CRT's first call through the
# table (0x469180) had no function.
[[image.main.add]]
name = "StaticInitVuMicrocodeTable"
range = [0x00469180, 0x0046918C]
why = "Ctor table entry 0: j VuMicrocodeTableInitMaybe_152830 with a0 = 0x491280."

[[image.main.add]]
name = "StaticInit"
range = [0x00469190, 0x00469300]
why = "Ctor table entry 1, before the first StaticInit RGDecomp maps."

[[image.main.resize]]
start = 0x004693A0
end = 0x004693AC
why = """StaticInitTexAnimeCfg_4693a0 is four constructors: this thunk
(j 0x164080) and the three below, each its own ctor table entry."""

[[image.main.add]]
name = "StaticInit"
range = [0x004693B0, 0x0046941C]
why = "Ctor table entry at 0x46F9D4, split out of StaticInitTexAnimeCfg_4693a0."

[[image.main.add]]
name = "StaticInit"
range = [0x00469420, 0x00469440]
why = "Ctor table entry at 0x46F9D8 (tail call to 0x100620), split out of StaticInitTexAnimeCfg_4693a0."

[[image.main.add]]
name = "StaticInit"
range = [0x00469440, 0x00469448]
why = "Ctor table entry at 0x46F9DC (clears a gp global), split out of StaticInitTexAnimeCfg_4693a0."

# Code RGDecomp's map leaves out: functions only ever reached through
