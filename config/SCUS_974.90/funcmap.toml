range = [0x0010FDD8, 0x0010FDE4]
why = "j MpegReportError_115a90 with a1 = 0x456348; pointer at 0x4563DC."

[[image.main.add]]
name = "MpegReportErrorThunk"
range = [0x0010FDE8, 0x0010FDF4]
why = "j MpegReportError_115a90 with a1 = 0x456380; pointer at 0x4563E0."

[[image.main.add]]
