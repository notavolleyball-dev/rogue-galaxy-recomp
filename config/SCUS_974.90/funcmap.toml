[[image.main.add]]
name = "Cleanup"
range = [0x0012F898, 0x0012F8B4]
why = "newlib _cleanup(): _cleanup_r(_impure_ptr)."

[[image.main.add]]
name = "InitSignal"
range = [0x00134278, 0x00134294]
why = "newlib _init_signal(): _init_signal_r(_impure_ptr)."

[[image.main.add]]
name = "Sigtramp"
