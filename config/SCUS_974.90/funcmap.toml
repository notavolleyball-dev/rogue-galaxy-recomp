# Function maps for SCUS_974.90: what functions_<image>.csv contain beyond
# RGDecomp's symbol files, and why.
#
#   python setup.py maps --rgdecomp <RGDecomp checkout>   (regenerate the CSVs)
#   python setup.py check                                 (verify them against disc/)
#
# Every correction below was found by `check` against the retail images and
# confirmed by reading the code. See docs/MAPS.md for the method.

[source]
url = "https://github.com/Dorgengoa/RGDecomp"
commit = "c8c8b3cd9e36826b5378731b93819e1a23fecbfb"
license = "CC0-1.0"

# SHA-256 of config/<file> at that commit. `maps` refuses other inputs.
